<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gateway - Sign Up</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; text-align: center; padding-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; }
        input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <h3>Create Gateway Account</h3>
    <input type="text" id="regUser" placeholder="Username">
    <input type="text" id="regPhone" placeholder="Phone Number">
    <input type="password" id="regPass" placeholder="Password">
    <button onclick="handleSignup()">Register Account</button>
</div>

<script>
    async function handleSignup() {
        const phone = document.getElementById('regPhone').value;
        const payload = {
            username: document.getElementById('regUser').value,
            phoneNumber: phone,
            password: document.getElementById('regPass').value
        };

        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const result = await response.json();

        // Save phone to memory to verify it on next screen
        localStorage.setItem("verifyPhone", phone);
        alert("Registration successful! Preserved Simulated Key: " + result.simulatedSMS);
        window.location.href = "verify.html";
    }
</script>
</body>
</html>
