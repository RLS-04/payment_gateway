<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Unified Payment Gateway</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; padding: 40px; text-align: center; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 450px; margin: 0 auto 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; }
        .hidden { display: none; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        .sms-alert { background: #fff3cd; color: #856404; padding: 15px; border: 1px solid #ffeeba; border-radius: 6px; margin-top: 15px; font-family: monospace; white-space: pre-line; }
    </style>
</head>
<body>

<h2>🎓 Cybersecurity Simulated Payment Gateway</h2>
<p>පියවරෙන් පියවර පද්ධතිය ක්‍රියාත්මක වන ආකාරය අධ්‍යයනය කරන්න.</p>

<!-- 1. REGISTRATION SECTION -->
<div id="sectionRegister" class="card">
    <h3>Step 1: User Registration</h3>
    <input type="text" id="regUser" placeholder="Username">
    <input type="text" id="regPhone" placeholder="Phone Number (e.g., 0771234567)">
    <input type="password" id="regPass" placeholder="Password PIN">
    <button onclick="actionRegister()">Register & Request SMS OTP</button>
    <div id="smsBoxRegister" class="sms-alert hidden"></div>
</div>

<!-- 2. REGISTRATION OTP VERIFICATION -->
<div id="sectionVerifyReg" class="card hidden">
    <h3>Step 2: Device Verification</h3>
    <p>ඔබගේ දුරකථනයට ලැබුණු අංක 6 කේතය ඇතුළත් කරන්න:</p>
    <input type="text" id="regOtpInput" placeholder="000000">
    <button onclick="actionVerifyRegistration()">Verify & Activate Account</button>
</div>

<!-- 3. SYSTEM LOGIN -->
<div id="sectionLogin" class="card hidden">
    <h3>Step 3: User Login</h3>
    <input type="text" id="loginId" placeholder="Username or Phone Number">
    <input type="password" id="loginPass" placeholder="Password PIN">
    <button onclick="actionLogin()">Login</button>
</div>

<!-- 4. BILL SELECTION -->
<div id="sectionPayForm" class="card hidden">
    <h3>Step 4: Select Utility Bill</h3>
    <select id="billCategory">
        <option>Electricity Bill</option>
        <option>Telecommunication</option>
        <option>Water Utility</option>
    </select>
    <input type="number" id="payAmt" placeholder="Amount (LKR)">
    <button onclick="actionInitiatePayment()">Pay Bill & Request OTP</button>
    <div id="smsBoxPayInitiate" class="sms-alert hidden"></div>
</div>

<!-- 5. CARD DETAILS & TRANSACTION OTP -->
<div id="sectionCardAuth" class="card hidden">
    <h3>Step 5: Secure Card Payment Auth</h3>
    <input type="text" id="cardNumberInput" placeholder="Card Number (Use: 4242 4242 4242 4242)">
    <input type="text" id="payOtpInput" placeholder="Enter Transaction OTP">
    <button onclick="actionFinalPayment()">Authorize Transfer</button>
    <div id="smsReceipt" class="sms-box hidden"></div>
</div>

<!-- JAVASCRIPT CONNECTIVITY LAYER -->
<script>
    let globalUsername = "";
    let globalPhone = "";
    let globalAmount = 0;

    // Backend එකට දත්ත යවන්න පොදු Function එකක් (Fetch API)
    async function sendPostRequest(endpoint, data) {
        const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        return response.json();
    }

    // 1. Registration Handler
    async function actionRegister() {
        console.log("👉 Checkpoint 1: බටන් එක වැඩ! දත්ත එකතු කරනවා...");

        globalPhone = document.getElementById('regPhone').value;
        const payload = {
            username: document.getElementById('regUser').value,
            phoneNumber: globalPhone,
            password: document.getElementById('regPass').value
        };

        console.log("👉 Checkpoint 2: Java එකට දත්ත යවන්න ලෑස්තියි. Payload එක: ", payload);

        try {
            const result = await sendPostRequest('/api/auth/register', payload);

            console.log("👉 Checkpoint 3: Java එකෙන් උත්තරයක් ආවා! බැක්එන්ඩ් එකෙන් එවපු මුළු දත්ත ටික මෙන්න: ", result);

            const smsBox = document.getElementById('smsBoxRegister');
            if (smsBox) {
                smsBox.classList.remove('hidden');
                smsBox.innerText = `[📩 SIMULATED SMS]\n${result.simulatedSMS}`;
                console.log("👉 Checkpoint 4: Screen එකට දත්ත දැම්මා! පෙනෙන්න ඕනේ.");
            } else {
                console.log("❌ වැරැද්ද: 'smsBoxRegister' කියන ID එක තියෙන කොටස HTML එකේ සොයාගත නොහැක!");
            }

            setTimeout(() => {
                document.getElementById('sectionRegister').classList.add('hidden');
                document.getElementById('sectionVerifyReg').classList.remove('hidden');
            }, 3500);

        } catch (error) {
            console.log("❌ දරුණු වැරැද්දක්: Java එකට සම්බන්ධ වෙන්න බැරි වුණා! Error එක: ", error);
        }
    }

    // 2. OTP Verification Handler
    async function actionVerifyRegistration() {
        const payload = {
            phoneNumber: globalPhone,
            otp: document.getElementById('regOtpInput').value
        };
        const result = await sendPostRequest('/api/auth/verify-otp', payload);

        if (result.status === "SUCCESS") {
            alert("Device verified successfully!");
            document.getElementById('sectionVerifyReg').classList.add('hidden');
            document.getElementById('sectionLogin').classList.remove('hidden');
        } else {
            alert(result.message);
        }
    }

    // 3. Login Handler
    async function actionLogin() {
        // 💡 HTML text boxes වල තියෙන අගයන් ගන්නවා
        const idInput = document.getElementById('loginId').value;
        const passInput = document.getElementById('loginPass').value;

        // 💡 Java එක බලාපොරොත්තු වන නිවැරදි වචන (Keys) වලින් Payload එක හදනවා
        const payload = {
            identifier: idInput,
            password: passInput
        };

        // 💡 Backend එකට දත්ත යවනවා
        const result = await sendPostRequest('/api/auth/login', payload);

        if (result.status === "SUCCESS") {
            globalUsername = result.username; // මුළු සිස්ටම් එකටම Username එක මතක තියාගන්නවා
            alert("Login Successful! Welcome " + globalUsername);

            // Login කොටස හංගලා බිල්පත් ගෙවන කොටස පෙන්වනවා
            document.getElementById('sectionLogin').classList.add('hidden');
            document.getElementById('sectionPayForm').classList.remove('hidden');
        } else {
            alert("Login Failed: " + result.message);
        }
    }


    // 4. Payment Initiation Handler
    async function actionInitiatePayment() {
        globalAmount = parseFloat(document.getElementById('payAmt').value);
        const payload = { username: globalUsername, amount: globalAmount };

        // Backend එකේ PaymentController වෙත දත්ත යැවීම
        const result = await sendPostRequest('/api/payments/initiate', payload);

        if (result.status === "OTP_SENT") {
            const smsBox = document.getElementById('smsBoxPayInitiate');
            smsBox.classList.remove('hidden');
            smsBox.innerText = `[📩 SIMULATED SMS]\n${result.simulatedSMS}`;

            setTimeout(() => {
                document.getElementById('sectionPayForm').classList.add('hidden');
                document.getElementById('sectionCardAuth').classList.remove('hidden');
            }, 3500);
        } else {
            alert(result.message); // බැලන්ස් මදි නම් මෙතනින් වැටෙනවා
        }
    }

    // 5. Final Payment Authorization Handler
    async function actionFinalPayment() {
        const payload = {
            username: globalUsername,
            amount: globalAmount,
            billType: document.getElementById('billCategory').value,
            cardNumber: document.getElementById('cardNumberInput').value,
            otp: document.getElementById('payOtpInput').value
        };
        const result = await sendPostRequest('/api/payments/confirm', payload);

        const receiptBox = document.getElementById('smsReceipt');
        receiptBox.style.display = "block";
        receiptBox.className = "sms-alert";

        if (result.status === "SUCCESS") {
            receiptBox.style.background = "#d4edda";
            receiptBox.style.color = "#155724";
            receiptBox.innerText = `🎉 Successful!\n${result.simulatedSMS}`;
        } else {
            receiptBox.style.background = "#f8d7da";
            receiptBox.style.color = "#721c24";
            receiptBox.innerText = `❌ Transaction Declined!\nReason: ${result.message}`;
        }
    }
</script>
</body>
</html>
