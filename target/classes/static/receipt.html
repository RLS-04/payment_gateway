<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gateway - Digital Dynamic Receipt</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; text-align: center; padding-top: 40px; }
        .receipt-card { background: white; padding: 30px; border-radius: 12px; max-width: 450px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px dashed #e2e8f0; padding: 10px 0; font-size: 14px; }
        .row.total { border-bottom: none; font-weight: bold; font-size: 16px; color: #2c3e50; }
        .balance-highlight { background: #e0f2fe; padding: 15px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; text-align: center; color: #0369a1; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="receipt-card">
    <h3 style="text-align: center; margin-top: 0;">🧾 Settlement Invoice Receipt</h3>

    <div class="balance-highlight">
        Updated Account Balance: LKR <span id="lblUpdatedBalance">0.00</span>
    </div>

    <h4>Transaction Summary Metadata:</h4>
    <div class="row"><span>Settled Bill Type:</span><span id="lblBillType">-</span></div>
    <div class="row"><span>Amount Paid:</span>LKR <span id="lblAmountPaid">0.00</span></div>

    <h4>Provided Billing Metadata:</h4>
    <div class="row"><span>Target Account Ref:</span><span id="lblAccountNo">-</span></div>
    <div class="row"><span>Consumer NIC No:</span><span id="lblNicNo">-</span></div>
    <div class="row"><span>Associated Mobile No:</span><span id="lblPhoneNo">-</span></div>
    <div class="row"><span>Timestamp Clearance:</span><span id="lblTimestamp">-</span></div>

    <button onclick="exitPortal()">Return to Main Billing Panel</button>
</div>

<script>
    async function loadReceiptDetails() {
        const user = localStorage.getItem("sessionUser");

        // Call our new endpoints API route path via Get method structure
        const response = await fetch(`/api/payments/receipt-summary?username=${user}`);
        const data = await response.json();

        // Populate the interface data fields
        document.getElementById('lblUpdatedBalance').innerText = data.currentBalance.toFixed(2);
        document.getElementById('lblBillType').innerText = data.billType || "N/A";
        document.getElementById('lblAmountPaid').innerText = data.amountPaid ? data.amountPaid.toFixed(2) : "0.00";
        document.getElementById('lblAccountNo').innerText = data.accountNo || "N/A";
        document.getElementById('lblNicNo').innerText = data.nicNo || "N/A";
        document.getElementById('lblPhoneNo').innerText = data.phoneNo || "N/A";
        document.getElementById('lblTimestamp').innerText = data.timestamp || "N/A";
    }

    function exitPortal() {
        // Drop transactional details out of volatile storage space, keeping active session username intact
        localStorage.removeItem("txAmount");
        localStorage.removeItem("txCategory");
        localStorage.removeItem("txAccount");
        localStorage.removeItem("txNic");
        localStorage.removeItem("txPhone");
        window.location.href = "payment.html";
    }

    // Initialize execution setup block on page entry
    window.onload = loadReceiptDetails;
</script>
</body>
</html>
