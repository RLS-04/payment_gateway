<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Portal</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; text-align: center; padding-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: left; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="card">
    <h3>Invoice Settlement</h3>
    <label>Select Category</label>
    <select id="billType" onchange="adjustFormFields()">
        <option value="Telecommunication">Telecommunication</option>
        <option value="Electricity">Electricity</option>
        <option value="Other">Other Payments</option>
    </select>

    <div id="dynamicFields">
        <!-- Fields inject here depending on category choice -->
    </div>

    <input type="number" id="payAmount" placeholder="Value (LKR)">
    <button onclick="requestPaymentOtp()">Authorize Invoice & Request OTP</button>
</div>

<script>
    function adjustFormFields() {
        const selectValue = document.getElementById('billType').value;
        const container = document.getElementById('dynamicFields');
        container.innerHTML = ""; // Reset

        if (selectValue === "Telecommunication") {
            // 💡 id="inputPhone" එකතු කර ඇත
            container.innerHTML = `<input type="text" id="inputPhone" placeholder="Phone Number">`;
        } else if (selectValue === "Electricity") {
            // 💡 id="inputAccount" සහ id="inputPhone" එකතු කර ඇත
            container.innerHTML = `
            <input type="text" id="inputAccount" placeholder="Account Number">
            <input type="text" id="inputPhone" placeholder="Phone Number">`;
        } else if (selectValue === "Other") {
            // 💡 id="inputAccount", id="inputNic", සහ id="inputPhone" එකතු කර ඇත
            container.innerHTML = `
            <input type="text" id="inputAccount" placeholder="Account Number">
            <input type="text" id="inputNic" placeholder="NIC Number">
            <input type="text" id="inputPhone" placeholder="Phone Number">`;
        }
    }


    async function requestPaymentOtp() {
        const user = localStorage.getItem("sessionUser");
        const amt = document.getElementById('payAmount').value;
        const type = document.getElementById('billType').value;

        const accElement = document.getElementById('inputAccount');
        const nicElement = document.getElementById('inputNic');
        const phoneElement = document.getElementById('inputPhone');

        const accValue = accElement ? accElement.value : "";
        const nicValue = nicElement ? nicElement.value : "";
        const phoneValue = phoneElement ? phoneElement.value : "";

        const res = await fetch('/api/payments/initiate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: user, amount: amt })
        });
        const data = await res.json();

        console.log("👉 Backend Response:", data);

        // 💡 සාර්ථකව ඊළඟ පිටුවට යන්න නම් Java එකෙන් එවන "OTP_REQUIRED" කියන වචනයම මෙතනට දිය යුතුයි!
        if (data.status === "OTP_REQUIRED") {

            // දත්ත ටික LocalStorage එකේ සේව් කරගන්නවා
            localStorage.setItem("txAmount", amt);
            localStorage.setItem("txCategory", type);
            localStorage.setItem("txAccount", accValue);
            localStorage.setItem("txNic", nicValue);
            localStorage.setItem("txPhone", phoneValue);

            // 💡 Java එකෙන් එවන මැසේජ් එක පෙන්නනවා (simulatedSMS)
            alert("Authorization Required!\n" + data.simulatedSMS);

            // ⚡ දැන් සාර්ථකව ඊළඟ පිටුවට (checkout.html) මාරු වෙනවා!
            window.location.href = "checkout.html";

        } else {
            // මොකක් හරි හේතුවකින් බැලන්ස් මදි වුණොත් හෝ වැරදුණොත් ලැබෙන පණිවිඩය
            alert(data.message || "Transaction failed to initiate. Please try again.");
        }
    }

    // Initialize default form layout on page launch
    window.onload = adjustFormFields;
</script>
</body>
</html>
